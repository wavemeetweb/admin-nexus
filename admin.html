<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel | Nexus Global Control</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root { --danger: #ef4444; --safe: #22c55e; --bg: #050505; --panel: #111; --border: #333; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: #fff; padding: 20px; }

        /* HEADER & STATS */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: gray; margin-right: 8px; }
        .connected { background: var(--safe); box-shadow: 0 0 10px var(--safe); }

        /* SEARCH & FILTER */
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; }
        
        /* USER TABLE */
        .table-container { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #1a1a1a; padding: 15px; color: #888; font-size: 12px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tr:hover { background: #161616; }

        /* BUTTONS */
        .ban-btn { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .ban-btn:hover { background: var(--danger); color: #fff; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="letter-spacing: -1px;">SENTINEL <span style="color:var(--danger)">MODERATOR</span></h1>
            <p style="font-size: 12px; color: #666;"><span id="status-dot" class="status-dot"></span> System: <span id="status-text">OFFLINE</span></p>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 24px; font-weight: bold;" id="user-count">0</div>
            <div style="font-size: 10px; color: #666;">LIVE SESSIONS</div>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="search-bar" placeholder="Search 2,000+ students by Name or UID..." oninput="filterUsers()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Grade/Sec</th>
                    <th>Unique ID (UID)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                </tbody>
        </table>
    </div>

    <script>
        // 1. SET YOUR MAIN RENDER URL HERE
        const SCHOOL_SERVER = "https://nexus-w4w9.onrender.com"; 
        const socket = io(SCHOOL_SERVER);
        const MASTER_SECRET = "VINAYAK_SUPER_ADMIN_2026";

        let allUsers = [];

        // Connection Handling
        socket.on('connect', () => {
            document.getElementById('status-dot').classList.add('connected');
            document.getElementById('status-text').innerText = "ONLINE & SECURED";
            document.getElementById('status-text').style.color = "#22c55e";
        });

        // Listen for Global Updates from Main Repo
        socket.on('admin-update-list', (users) => {
            allUsers = users;
            renderTable(allUsers);
        });

        function renderTable(users) {
            const tbody = document.getElementById('user-table-body');
            document.getElementById('user-count').innerText = users.length;
            
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td><b style="color:#fff">${u.name}</b></td>
                    <td>Class ${u.class}-${u.section}</td>
                    <td style="color:#666; font-size:11px;">${u.uid}</td>
                    <td>
                        <button class="ban-btn" onclick="executeBan('${u.uid}', '${u.name}')">TERMINATE SESSION</button>
                    </td>
                </tr>
            `).join('');

            if(users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:40px; color:#555;">No active students in rooms.</td></tr>`;
            }
        }

        function filterUsers() {
            const term = document.getElementById('search-bar').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                u.name.toLowerCase().includes(term) || u.uid.toLowerCase().includes(term)
            );
            renderTable(filtered);
        }

        function executeBan(uid, name) {
            if(confirm(`ARE YOU SURE? This will globally ban ${name} from all school meetings.`)) {
                socket.emit('execute-global-ban', {
                    targetUid: uid,
                    secret: MASTER_SECRET
                });
                alert(`Termination signal sent for ${name}.`);
            }
        }
    </script>
</body>
</html>
