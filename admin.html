<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SENTINEL | Global Moderation</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff4b2b; --green: #00ff87; --dark: #020617; --panel: rgba(30, 41, 59, 0.7); }
        body { background: var(--dark); color: white; font-family: 'Outfit', sans-serif; padding: 40px; margin: 0; }
        .glass { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        .stat-card { padding: 20px; text-align: center; }
        .stat-card h2 { margin: 0; font-size: 2.5rem; color: var(--green); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; color: #64748b; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-kick { background: rgba(255, 75, 43, 0.1); color: var(--red); border: 1px solid var(--red); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-kick:hover { background: var(--red); color: white; box-shadow: 0 0 15px var(--red); }
        .online-dot { height: 10px; width: 10px; background-color: var(--green); border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SENTINEL <span style="color:var(--red)">ADM</span></h1>
        <div id="engine-status" style="font-size: 0.9rem; color: #64748b;">DISCONNECTED</div>
    </div>

    <div class="stats-row">
        <div class="stat-card glass">
            <h2 id="total-online">0</h2>
            <p>Active Students</p>
        </div>
        <div class="stat-card glass">
            <h2>50</h2>
            <p>Room Capacity</p>
        </div>
        <div class="stat-card glass">
            <h2>2026</h2>
            <p>Protocol Year</p>
        </div>
    </div>

    <div class="glass" style="padding: 20px;">
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Class / Section</th>
                    <th>Unique ID (UID)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="user-table">
                </tbody>
        </table>
    </div>

    <script>
        // 1. CHANGE THIS TO YOUR LIVE MAIN REPO URL
        const MAIN_REPO_URL = "https://your-main-nexus.onrender.com"; 
        const socket = io(MAIN_REPO_URL);
        const MASTER_SECRET = "VINAYAK_SUPER_ADMIN_2026";

        socket.on('connect', () => {
            document.getElementById('engine-status').innerHTML = "<span class='online-dot'></span> ENGINE LINKED";
        });

        socket.on('admin-update-list', (users) => {
            document.getElementById('total-online').innerText = users.length;
            const table = document.getElementById('user-table');
            
            if(users.length === 0) {
                table.innerHTML = "<tr><td colspan='4' style='text-align:center; padding:40px; color:#475569;'>No active students in sessions.</td></tr>";
                return;
            }

            table.innerHTML = users.map(u => `
                <tr>
                    <td><strong>${u.name}</strong></td>
                    <td>Class ${u.class}-${u.section}</td>
                    <td style="font-family: monospace; color:#64748b;">${u.uid}</td>
                    <td><button class="btn-kick" onclick="terminate('${u.uid}', '${u.name}')">TERMINATE ACCESS</button></td>
                </tr>
            `).join('');
        });

        function terminate(uid, name) {
            if(confirm(`ARE YOU SURE?\nThis will globally ban ${name} from all Zenith Nexus services.`)) {
                socket.emit('execute-global-ban', {
                    targetUid: uid,
                    secret: MASTER_SECRET
                });
            }
        }
    </script>
</body>
</html>
